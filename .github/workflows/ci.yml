name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # CI does not require a running Postgres for issue #1 - apps/api's
    # e2e test supplies a fallback DATABASE_URL so config validation
    # passes without a live DB (Prisma has no models yet).
    env:
      DATABASE_URL: postgresql://epgs:epgs@localhost:5432/epgs
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  db-migrations:
    runs-on: ubuntu-latest

    # Issue #3: validates the monitor_* Prisma migrations against a real
    # Postgres instance - forward migration on an empty DB, idempotent
    # re-apply, constraint behavior (unique/enum/FK), rollback, and
    # re-migration after rollback. Kept as its own job (separate from
    # build-and-test) so issue #1's DB-free CI guarantee for the base
    # build/lint/test/typecheck job is untouched.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epgs
          POSTGRES_PASSWORD: epgs
          POSTGRES_DB: epgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epgs -d epgs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://epgs:epgs@localhost:5432/epgs
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rules API e2e suite below loads the full AppModule, whose
      # health.controller.ts imports @epgs/shared-types - build it first
      # so that import resolves (mirrors the root build/test/typecheck
      # scripts' build:libs-first ordering). apps/worker's sync e2e suite
      # (issue #6) additionally depends on @epgs/matching-engine, hence
      # build:libs (not just build:shared-types) here.
      - name: Build shared-types + matching-engine
        run: pnpm run build:libs

      - name: Prisma validate + format check
        working-directory: apps/api
        run: |
          pnpm exec prisma validate
          pnpm exec prisma format
          git diff --exit-code prisma/schema.prisma

      - name: Apply migrations to empty database
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Re-apply migrations (idempotency check)
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Assert no schema drift vs migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Constraint + index smoke test
        working-directory: apps/api
        run: pnpm exec ts-node --transpile-only prisma/scripts/verify-constraints.ts

      # Issue #4: rules API e2e suite against this same real Postgres
      # instance - covers create/edit/disable/duplicate/concurrent-edit/
      # illegal-enum plus CSV import (full success/partial failure/
      # duplicate rows/encoding error/empty file). See
      # apps/api/test/rules.e2e-spec.ts's doc comment for why this lives
      # in the db-migrations job rather than the DB-free build-and-test
      # job. verify-constraints.ts's cleanup (above) already emptied
      # monitor_rule, so this suite starts from a clean table.
      - name: Rules API e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/rules.e2e-spec.ts

      # Issue #7: monitor workbench API e2e suite against this same real
      # Postgres instance - covers combined filters, cross-day Asia/Shanghai
      # boundaries, exact day edges, nulls, stable pagination, invalid-param
      # 400s, summary==list, and the read-only detail endpoint. It seeds its
      # own 6-rule/12-record fixture in beforeAll and wipes monitor_match ->
      # monitor_record -> monitor_rule in afterAll, so the seed-count step
      # below still sees exactly the 6 seeded RED rules.
      - name: Monitor API e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/monitor.e2e-spec.ts

      # Issue #6: incremental sync job e2e suite against this same real
      # Postgres instance - covers first-run full window, normal
      # incremental sync, same-timestamp collisions, duplicate-batch
      # idempotency, process-interruption cursor safety, late-arriving
      # updates via the look-back window, source-unavailable retry/
      # backoff, a single bad record not blocking the batch, and two
      # concurrent workers not creating duplicate records. Runs before
      # the rules e2e suite's data lingers are cleaned by its own
      # beforeEach, and before the migration rollback below (which drops
      # all tables and would break this suite too).
      - name: Sync job e2e suite (real Postgres)
        working-directory: apps/worker
        run: pnpm exec jest --config ./test/jest-e2e.json test/sync.e2e-spec.ts

      # Issue #4: seed script idempotency - creates the 6 initial RED
      # keywords, then re-runs and asserts no duplicates are created.
      - name: Seed script creates the 6 initial RED keyword rules
        working-directory: apps/api
        run: |
          pnpm exec ts-node --transpile-only prisma/seed.ts
          pnpm exec ts-node --transpile-only prisma/seed.ts
          COUNT=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM monitor_rule WHERE level = 'RED' AND is_enabled = true;")
          if [ "$COUNT" -ne 6 ]; then
            echo "Expected 6 enabled RED rules after seeding twice (idempotency check), got $COUNT"
            exit 1
          fi
        env:
          PGPASSWORD: epgs

      - name: Roll back migration
        run: psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260821040339_init_monitoring_schema/rollback.sql
        env:
          PGPASSWORD: epgs

      # Issue #26: two migrations now exist, so clearing only migration-1's
      # history row would leave migration-2 marked applied while its DDL was
      # rolled back - the re-deploy below would then skip it and the drift
      # gate would fail. Delete ALL migration history rows so the re-deploy
      # re-applies both migrations (today this is a strict generalization:
      # migration-1 was previously the only row).
      - name: Clear migration history rows for rolled-back migration
        run: psql "$DATABASE_URL" -c "DELETE FROM \"_prisma_migrations\";"
        env:
          PGPASSWORD: epgs

      - name: Re-apply migration after rollback (upgrade path still works)
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
