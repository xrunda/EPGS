name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # CI does not require a running Postgres for issue #1 - apps/api's
    # e2e test supplies a fallback DATABASE_URL so config validation
    # passes without a live DB (Prisma has no models yet).
    env:
      DATABASE_URL: postgresql://epgs:epgs@localhost:5432/epgs
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-at-least-32-characters
      NOTIFICATION_SECRET_KEY: ci-only-notification-key-at-least-32-chars
      # Issue #54: {{hospitalName}} placeholder substitution in notification
      # template rendering (AppConfig.hospitalName).
      HOSPITAL_NAME: 菏泽市中医医院

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Issue #153: start.sh 的停机安全护栏。
      #
      # 这两条对应 2026-11-20 院内的两次真实事故：
      #   1) 先 stop_all() 再 git pull —— 院内到 GitHub 断网时 pull 失败，
      #      服务已停、构建与重启都没跑，全院 502；
      #   2) PID 文件记的是 pnpm 外层 PID，node 子进程漏网继续占着 3000，
      #      新进程 EADDRINUSE 退出，而 /health 200 来自旧进程 —— 假绿。
      # 这里既钉住顺序，也真的跑一次「pull 失败」看它是否拒绝停服务。
      - name: Deploy script guards (start.sh)
        run: |
          set -euo pipefail
          bash -n start.sh

          pull_line=$(grep -n 'git pull --ff-only' start.sh | head -1 | cut -d: -f1)
          # 取 pull 之后的第一个 stop_all：`bash start.sh stop` 子命令里也有一次停服务
          # 调用（它本来就不跑 pull，且随即 exit），不能用 head -1 直接取第一处。
          stop_line=$(awk -v p="$pull_line" '/^[[:space:]]*stop_all$/ && NR > p {print NR; exit}' start.sh)
          echo "git pull at line $pull_line, stop_all at line $stop_line"
          test -n "$pull_line" && test -n "$stop_line"

          # EADDRINUSE 必须让脚本失败，不能报「启动完成」。
          grep -q 'EADDRINUSE' start.sh
          # 停进程必须按真实命令行清扫，而不只依赖 PID 文件。
          grep -q 'apps/api/dist/main' start.sh

          # 行为测试：pull 失败 → 非 0 退出，且绝不先说「停止已运行的 api/worker」。
          tmp=$(mktemp -d)
          cp start.sh "$tmp/"
          cd "$tmp"
          git init -q
          git remote add origin /nonexistent/repo.git
          if bash start.sh > out.txt 2>&1; then
            echo "::error::pull 失败时 start.sh 应当以非 0 退出"
            cat out.txt
            exit 1
          fi
          cat out.txt
          grep -q '服务未受影响' out.txt
          if grep -q '停止已运行的 api/worker' out.txt; then
            echo "::error::pull 失败前就把服务停了（issue #153 回归）"
            exit 1
          fi

      # Issue #155: systemd 托管。2026-11-21 的事故根因是 api/worker 以裸
      # nohup 进程运行——手工拉起后随 SSH 会话消失，全院内网 502 约 30 小时
      # 无人发现。这里钉住三件事：unit 模板在、安装脚本语法正确、start.sh
      # 真的会在 unit 存在时切到 systemctl（同时保留 nohup 回退）。
      - name: Deploy script guards (systemd units)
        run: |
          set -euo pipefail
          for unit in api worker nginx; do
            test -f "deploy/systemd/epgs-${unit}.service.template"
          done
          bash -n deploy/install-systemd.sh

          # 崩溃后必须自动拉起，否则托管就失去意义。
          grep -q '^Restart=always' deploy/systemd/epgs-api.service.template
          grep -q '^Restart=always' deploy/systemd/epgs-worker.service.template
          # systemd 模式下也必须整组杀，避免 #129/#153 的孤儿进程问题。
          grep -q '^KillMode=control-group' deploy/systemd/epgs-api.service.template
          # nginx 配置是生成物：启动前必须重新校验语法。
          # 模板里 nginx 路径是占位符（__NGINX_BIN__），不能直接按 "nginx -t" 匹配。
          grep -q '^ExecStartPre=.* -t -c ' deploy/systemd/epgs-nginx.service.template

          # start.sh 同时具备两条路径：有 unit 走 systemctl，没有则回退 nohup。
          grep -Eq 'systemctl (start|restart) epgs-api\.service' start.sh
          grep -q 'nohup pnpm --filter api run start:prod' start.sh

      # Issue #155: 真正渲一遍 unit，确认占位符全部被替换、关键指令落在正确位置。
      # 渲染失败或残留 __XXX__ 的 unit 会让机器在重启后起不来，必须在 CI 挡住。
      - name: Render systemd units (issue #155)
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          UNIT_DIR="$out" RENDER_ONLY=1 \
            PNPM_BIN=/usr/bin/pnpm NGINX_BIN=/usr/sbin/nginx \
            bash deploy/install-systemd.sh

          for unit in api worker nginx; do
            test -s "$out/epgs-${unit}.service"
            if grep -q '__[A-Z_]*__' "$out/epgs-${unit}.service"; then
              echo "::error::epgs-${unit}.service 仍有未替换的占位符"
              grep -n '__[A-Z_]*__' "$out/epgs-${unit}.service"
              exit 1
            fi
          done

          grep -q '^ExecStart=/usr/bin/pnpm --filter api run start:prod$' "$out/epgs-api.service"
          grep -q '^Environment=PORT=3001$' "$out/epgs-worker.service"
          grep -q "^PIDFile=$PWD/.run-nginx.pid$" "$out/epgs-nginx.service"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  db-migrations:
    runs-on: ubuntu-latest

    # Issue #3: validates the monitor_* Prisma migrations against a real
    # Postgres instance - forward migration on an empty DB, idempotent
    # re-apply, constraint behavior (unique/enum/FK), rollback, and
    # re-migration after rollback. Kept as its own job (separate from
    # build-and-test) so issue #1's DB-free CI guarantee for the base
    # build/lint/test/typecheck job is untouched.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epgs
          POSTGRES_PASSWORD: epgs
          POSTGRES_DB: epgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epgs -d epgs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://epgs:epgs@localhost:5432/epgs
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-at-least-32-characters
      NOTIFICATION_SECRET_KEY: ci-only-notification-key-at-least-32-chars
      # Issue #54: {{hospitalName}} placeholder substitution in notification
      # template rendering (AppConfig.hospitalName).
      HOSPITAL_NAME: 菏泽市中医医院

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rules API e2e suite below loads the full AppModule, whose
      # health.controller.ts imports @epgs/shared-types - build it first
      # so that import resolves (mirrors the root build/test/typecheck
      # scripts' build:libs-first ordering). apps/worker's sync e2e suite
      # (issue #6) additionally depends on @epgs/matching-engine, hence
      # build:libs (not just build:shared-types) here.
      - name: Build shared-types + matching-engine
        run: pnpm run build:libs

      - name: Prisma validate + format check
        working-directory: apps/api
        run: |
          pnpm exec prisma validate
          pnpm exec prisma format
          git diff --exit-code prisma/schema.prisma

      - name: Apply migrations to empty database
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Re-apply migrations (idempotency check)
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Assert no schema drift vs migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Constraint + index smoke test
        working-directory: apps/api
        run: pnpm exec ts-node --transpile-only prisma/scripts/verify-constraints.ts

      # Issue #4: rules API e2e suite against this same real Postgres
      # instance - covers create/edit/disable/duplicate/concurrent-edit/
      # illegal-enum plus CSV import (full success/partial failure/
      # duplicate rows/encoding error/empty file). See
      # apps/api/test/rules.e2e-spec.ts's doc comment for why this lives
      # in the db-migrations job rather than the DB-free build-and-test
      # job. verify-constraints.ts's cleanup (above) already emptied
      # monitor_rule, so this suite starts from a clean table.
      - name: Rules API e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/rules.e2e-spec.ts

      # Issue #88: attention-semantic configuration e2e suite against this
      # same real Postgres - the versioned-edit rule (a wording/colour change
      # creates a NEW row and disables the old one, so a historical AI finding
      # still resolves to the meaning that was in force), the optimistic-lock
      # 409s for both a superseded-row edit and a stale in-place edit, the
      # duplicate-name 409, the illegal-level/blank-field 400s, the
      # explicit-only-and-idempotent preset load, and the RULE_ADMIN/VIEWER
      # write boundary. Wipes attention_semantic in beforeEach and its own test
      # users in afterAll, so the seed-count step below still sees exactly the
      # 17 seeded RED rules.
      - name: Attention semantics API e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/attention-semantics.e2e-spec.ts

      # Issue #7: monitor workbench API e2e suite against this same real
      # Postgres instance - covers combined filters, cross-day Asia/Shanghai
      # boundaries, exact day edges, nulls, stable pagination, invalid-param
      # 400s, summary==list, and the read-only detail endpoint. It seeds its
      # own 6-rule/12-record fixture in beforeAll and wipes monitor_match ->
      # monitor_record -> monitor_rule in afterAll, so the seed-count step
      # below still sees exactly the 17 seeded RED rules.
      - name: Monitor API e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/monitor.e2e-spec.ts

      # Issue #88 (PR-B): the doctor-facing AI explanation e2e suite against
      # this same real Postgres - attentionSource on all four states
      # (BOTH/RULE/AI_REPORT/NONE), an excerpt byte-identical to a substring of
      # the stored report body (recomputed server-side from offsets, since the
      # excerpt itself is deliberately never stored), a STALE excerpt being
      # dropped while its finding survives with HTTP 200, the audit-field leak
      # scan over the serialized body (no hash, model id, latency or error
      # vocabulary), and the list envelope carrying attentionSource but never
      # aiSemantics. It wipes monitor_match -> monitor_record -> monitor_rule in
      # beforeAll AND afterAll and deletes its own attention_semantic rows
      # (after the records, because monitor_report_ai_match's FK is Restrict),
      # so the seed-count step below still sees exactly the 17 seeded RED rules.
      - name: Monitor AI explanation e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/monitor-ai.e2e-spec.ts

      # Issue #103: level-conflict e2e suite against this same real Postgres -
      # the doctor's notice and the admin's todo agreeing about the SAME seeded
      # record (one rule, two audiences), the agreement negative, the read
      # state's both-directions idempotency, the window bound, the audit rows
      # naming the actor, the RULE_ADMIN-only gate on reads as well as writes,
      # and the "no patient data on this wire" scan. It seeds its own rules,
      # semantics and records and wipes monitor_match -> monitor_record ->
      # monitor_rule in beforeAll AND afterAll, so the seed-count step below
      # still sees exactly the 17 seeded RED rules.
      - name: Level conflicts e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/level-conflicts.e2e-spec.ts

      - name: Local authentication e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/auth.e2e-spec.ts

      # Issue #13: security e2e suite against this same real Postgres -
      # the full role permission matrix (VIEWER/RULE_ADMIN/SYSTEM_ADMIN/
      # AUDITOR + unauthenticated 401s), department data-scope with
      # horizontal-escalation-as-404, patient-data masking, server-side
      # actor authority on rule writes, and audit-trail hygiene. It wipes
      # the tables it asserts totals on in beforeAll and cleans up in
      # afterAll, so the seed-count step below still sees exactly the 17
      # seeded RED rules.
      - name: Security e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/security.e2e-spec.ts

      # Issue #72: WeCom alert-link e2e suite against this same real Postgres -
      # the opaque link token as the ONLY credential on /api/alert-links/*,
      # the frozen-snapshot boundary (out-of-snapshot detail = 404), always-on
      # name masking with the report body kept, expiry 410 vs unknown 401,
      # the open counter, and that a link token can never reach the
      # cookie-guarded workbench routes. Seeds only its own TEST-AL-* rows and
      # deletes exactly those in afterAll (never wipes shared tables), so the
      # seed-count step below still sees exactly the 17 seeded RED rules.
      - name: Alert-link e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/alert-links.e2e-spec.ts

      # Issue #54: notification channel/template API + WeCom test-send e2e
      # suite against this same real Postgres - channel/template full
      # lifecycle, webhook masking, PUT-without-webhookUrl preserving the
      # stored ciphertext, the variables dictionary, NEWS-title-required 400,
      # test-send success rendering (against a seeded monitor summary) and
      # WeCom failure 502, and the VIEWER/RULE_ADMIN write 403s. It overrides
      # WecomWebhookSender with a fake and cleans up after itself, so the
      # seed-count step below still sees exactly the 17 seeded RED rules.
      - name: Notification API e2e suite (real Postgres)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/notifications.e2e-spec.ts

      # Issue #6: incremental sync job e2e suite against this same real
      # Postgres instance - covers first-run full window, normal
      # incremental sync, same-timestamp collisions, duplicate-batch
      # idempotency, process-interruption cursor safety, late-arriving
      # updates via the look-back window, source-unavailable retry/
      # backoff, a single bad record not blocking the batch, and two
      # concurrent workers not creating duplicate records. Runs before
      # the rules e2e suite's data lingers are cleaned by its own
      # beforeEach, and before the migration rollback below (which drops
      # all tables and would break this suite too).
      - name: Sync job e2e suite (real Postgres)
        working-directory: apps/worker
        run: pnpm exec jest --config ./test/jest-e2e.json test/sync.e2e-spec.ts

      # Issue #14: performance acceptance - proves the common workbench
      # filters stay under the 3s target on a 100k-row dataset (seeded by
      # the suite itself), and asserts the patient_type_code index added in
      # this issue exists. Runs after all other e2e suites and before the
      # seed step; its afterAll wipes audit_log -> app_user_access ->
      # app_user -> monitor_match -> monitor_record -> monitor_rule so the
      # seed-count step below still sees exactly the 17 seeded RED rules.
      - name: Performance e2e suite (real Postgres, 100k rows, <=3s)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json test/performance.e2e-spec.ts

      # Issue #4: seed script idempotency - seeds the keyword rules, then
      # re-runs and asserts no duplicates are created. The expected count
      # follows apps/api/prisma/seed.ts: 17 RED since 6bf29d5 (内镜中心定稿
      # RED 17 / YELLOW 13 / GREEN 0); update it together with the seed.
      - name: Seed script creates the 17 seeded RED keyword rules
        working-directory: apps/api
        run: |
          pnpm exec ts-node --transpile-only prisma/seed.ts
          pnpm exec ts-node --transpile-only prisma/seed.ts
          COUNT=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM monitor_rule WHERE level = 'RED' AND is_enabled = true;")
          if [ "$COUNT" -ne 17 ]; then
            echo "Expected 17 enabled RED rules after seeding twice (idempotency check), got $COUNT"
            exit 1
          fi
        env:
          PGPASSWORD: epgs

      - name: Roll back migration
        run: |
          # Newest-first: #103's level-conflict-read rollback comes first (it is
          # the newest migration, and the table is standalone - no FK in either
          # direction - so it holds no dependency, it is simply the top of the
          # stack), then #88's report-classify rollback (its
          # monitor_report_ai table has an FK to monitor_record, and it must
          # release the AttentionLevel type before #87's rollback runs), then
          # #87's semantic-judge rollback, which must also precede the #3
          # rollback below - monitor_match_semantic has an FK to monitor_match,
          # and the #3 rollback drops monitor_match WITHOUT CASCADE, so leaving
          # #87's table in place makes that statement fail outright. Then #72's
          # alert-link rollback
          # (alert_link has a FK to push_log, so it must precede the push-rule
          # rollback), then #70's push-assistant rollback (standalone tables),
          # then #61's push-rule rollback, #53's notification rollback, #14's
          # index rollback, and the #13 -> #31 -> #3 chain, so the migration
          # sequence is unwound in the same order it was applied (see
          # docs/go-live.md §7.2 for the full runbook).
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260927000000_add_monitor_level_conflict_read/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260926000000_add_ai_report_classify/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260925000000_add_semantic_judge/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260905060000_add_alert_link/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260903000000_add_push_assistant/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260823055843_add_notification_push_rules/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260823032959_add_notification_channel_template/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260821110858_add_monitor_record_patient_type_index/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260821103732_add_auth_access_and_audit_log/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260821093500_add_local_auth/rollback.sql
          psql "$DATABASE_URL" -f apps/api/prisma/migrations/20260821040339_init_monitoring_schema/rollback.sql
        env:
          PGPASSWORD: epgs

      # Issue #26: with multiple migrations now present, clearing only the
      # earliest history row would leave later ones marked applied while
      # their DDL was rolled back - the re-deploy below would then skip them
      # and the drift gate would fail. Delete ALL migration history rows so
      # the re-deploy re-applies every migration.
      - name: Clear migration history rows for rolled-back migration
        run: psql "$DATABASE_URL" -c "DELETE FROM \"_prisma_migrations\";"
        env:
          PGPASSWORD: epgs

      - name: Re-apply migration after rollback (upgrade path still works)
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
