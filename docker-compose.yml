services:
  postgres:
    image: postgres:16-alpine
    container_name: epgs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epgs
      POSTGRES_PASSWORD: epgs
      POSTGRES_DB: epgs
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - epgs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epgs -d epgs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  epgs_postgres_data:
