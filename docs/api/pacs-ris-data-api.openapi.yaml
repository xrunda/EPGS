openapi: 3.0.3
info:
  title: EPGS IRIS/Caché 内镜数据 API
  version: 2.0.0
  description: |
    医院 IRIS/Caché 数据库网关提供给 EPGS Worker 的只读接口。
    数据来自 Ens_RISReportResult、PA_Adm、PA_PatMas，仅限 RISR_SysCode='ES'。
    不面向浏览器，不返回关注等级或任何上报/处置字段。
  license:
    name: Proprietary - Internal Use Only
    url: https://github.com/xrunda/EPGS
servers:
  - url: https://{internalHost}/api/v1/endoscopy
    description: 医院内网；实际地址通过安全渠道提供
    variables:
      internalHost:
        default: api.example.invalid
security:
  - bearerAuth: []
tags:
  - name: Reports
    description: 内镜检查结果只读查询
  - name: Dictionaries
    description: 科室等受控字典数据
  - name: System
    description: 数据网关健康状态
paths:
  /reports:
    get:
      tags: [Reports]
      operationId: listEndoscopyReports
      summary: 按日期窗口分页读取内镜结果
      description: |
        后端始终附加 RISR_SysCode='ES'。日期和所有筛选必须参数绑定。
        稳定 sourceRecordId 的实际表达式由 Issue #24 实库核验后确定。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-08-21'
        - name: dateTo
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-08-22'
        - name: department
          in: query
          required: false
          schema:
            type: string
            maxLength: 220
        - name: patientType
          in: query
          required: false
          description: PAADM_Type 源代码
          schema:
            type: string
            maxLength: 16
        - name: examItem
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: 成功返回一页内镜结果
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPageResponse'
              examples:
                synthetic:
                  $ref: '#/components/examples/ReportPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CursorMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DataSourceUnavailable'
  /reports/{sourceRecordId}:
    get:
      tags: [Reports]
      operationId: getEndoscopyReport
      summary: 查询单条内镜结果
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: sourceRecordId
          in: path
          required: true
          description: 实库核验确认的稳定结果记录 ID
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: 成功返回内镜结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DataSourceUnavailable'
  /departments:
    get:
      tags: [Dictionaries]
      operationId: listEndoscopyDepartments
      summary: 获取内镜结果关联科室字典
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 成功返回科室字典
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DataSourceUnavailable'
  /health:
    get:
      tags: [System]
      operationId: getIrisGatewayHealth
      summary: 获取网关与 IRIS/Caché 数据源状态
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 网关可服务，状态为 UP 或 DEGRADED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 数据源不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    RequestId:
      description: 调用关联 ID
      schema:
        type: string
  schemas:
    EndoscopyReport:
      type: object
      additionalProperties: false
      required:
        - sourceRecordId
        - patientName
        - patientTypeName
        - examDate
      properties:
        sourceRecordId:
          type: string
          description: 实库核验确认的稳定结果记录 ID
        patientName:
          type: string
          description: PA_PatMas.PAPMI_Name
        department:
          type: string
          nullable: true
          description: PAADM_DepCode_DR->CTLOC_Desc
        bedNo:
          type: string
          nullable: true
          description: PAADM_CurrentBed_DR->BED_Code
        patientTypeCode:
          type: string
          nullable: true
          description: PA_Adm.PAADM_Type 原值
        patientTypeName:
          type: string
          description: 经医院字典确认的中文含义；未知时包含源代码
        examItem:
          type: string
          nullable: true
          description: Ens_RISReportResult.RISR_ItemDesc
        examDate:
          type: string
          format: date
          description: Ens_RISReportResult.RISR_ReportDate
        examTime:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?$'
          description: Ens_RISReportResult.RISR_ReportTime，HH:mm:ss[.fraction]
        reportContent:
          type: string
          nullable: true
          description: Ens_RISReportResult.RISR_ExamDesc 原文
        diagnosis:
          type: string
          nullable: true
          description: Ens_RISReportResult.RISR_DiagDesc 原文
    ReportPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/EndoscopyReport'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
    ReportPageResponse:
      type: object
      additionalProperties: false
      required: [requestId, serverTime, data]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/ReportPage'
    ReportResponse:
      type: object
      additionalProperties: false
      required: [requestId, serverTime, data]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/EndoscopyReport'
    Department:
      type: object
      additionalProperties: false
      required: [id, name, active]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
    DepartmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Department'
    DepartmentListResponse:
      type: object
      additionalProperties: false
      required: [requestId, serverTime, data]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/DepartmentList'
    ServiceStatus:
      type: string
      enum: [UP, DEGRADED, DOWN]
    HealthData:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          $ref: '#/components/schemas/ServiceStatus'
        database:
          $ref: '#/components/schemas/ServiceStatus'
        schemaVerifiedAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessfulQueryAt:
          type: string
          format: date-time
          nullable: true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [requestId, serverTime, data]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/HealthData'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [requestId, code, message]
      properties:
        requestId:
          type: string
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - FORBIDDEN
            - REPORT_NOT_FOUND
            - CURSOR_FILTER_MISMATCH
            - RATE_LIMITED
            - INTERNAL_ERROR
            - DATA_SOURCE_UNAVAILABLE
        message:
          type: string
  responses:
    BadRequest:
      description: 请求参数非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: 服务身份缺失或无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 调用方无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReportNotFound:
      description: 记录不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CursorMismatch:
      description: 游标与原过滤条件不一致
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 超过调用限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 已脱敏的内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DataSourceUnavailable:
      description: IRIS/Caché 数据源不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  examples:
    ReportPage:
      summary: 仅包含合成数据
      value:
        requestId: synthetic-request-id
        serverTime: '2026-08-21T06:00:00Z'
        data:
          items:
            - sourceRecordId: TEST-RIS-0001
              patientName: 测试患者甲
              department: 测试科室
              bedNo: TEST-12
              patientTypeCode: I
              patientTypeName: 住院
              examItem: 电子胃镜检查
              examDate: '2026-08-21'
              examTime: '10:05:30'
              reportContent: 测试报告内容，仅为合成数据。
              diagnosis: 测试诊断，仅为合成数据。
          nextCursor: opaque-cursor-value
          hasMore: true
